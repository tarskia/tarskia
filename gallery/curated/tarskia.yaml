version: 0.1.0
schemaRefs:
  - schema: gallery/tarskia@0.1
    layer: 0
  - schema: core/frontend@0.3
    layer: 0
  - schema: core/code@0.1
    layer: 1
  - schema: core/web-app@0.3
    layer: 0
  - schema: core/base@0.1
    layer: 0
  - schema: core/software@0.1
    layer: 1
entities:
  - id: browser-portal-app
    type: gallery/tarskia.types.portal-app
    name: Browser Portal App
    description: >-
      Browser portal app split into a browser runtime system plus gallery surface and shared viewer
      utilities.
    props:
      framework: react
      runtime: browser
    provenance:
      locations:
        - input: primary
          path: frontend/src/AppShell.tsx
        - input: primary
          path: frontend/src/PublicGalleryShell.tsx
        - input: primary
          path: frontend/src/semantic/bootstrap.ts
        - input: primary
          path: frontend/src/gallery/gallery-query.ts
    children:
      - id: browser-portal-app/browser-runtime
        type: core/software.types.system
        name: Browser Runtime
        description: Browser runtime split between route dispatch and semantic bootstrap.
        props:
          framework: react
          runtime: browser
        provenance:
          locations:
            - input: primary
              path: frontend/src/AppShell.tsx
            - input: primary
              path: frontend/src/PublicGalleryShell.tsx
            - input: primary
              path: frontend/src/gallery/gallery-query.ts
            - input: primary
              path: frontend/src/gallery/local-gallery.ts
            - input: primary
              path: frontend/src/semantic/bootstrap.ts
            - input: primary
              path: frontend/src/semantic/bundled-diagrams.ts
            - input: primary
              path: frontend/src/semantic/trusted-bundled-assets.ts
        children:
          - id: browser-portal-app/browser-runtime/route-dispatch
            type: core/software.types.system
            name: Route Dispatch
            description: Route dispatch split into gallery shell plus query and viewer helpers.
            props:
              framework: react
              runtime: browser
            provenance:
              locations:
                - input: primary
                  path: frontend/src/AppShell.tsx
                - input: primary
                  path: frontend/src/PublicGalleryShell.tsx
                - input: primary
                  path: frontend/src/gallery/gallery-query.ts
                - input: primary
                  path: frontend/src/gallery/local-gallery.ts
            children:
              - id: browser-portal-app/browser-runtime/route-dispatch/public-gallery-shell
                type: core/web-app.types.group
                name: Public Gallery Shell
                description: Public gallery shell split into browsing and viewer route surfaces.
                props:
                  mode: mixed
                provenance:
                  locations:
                    - input: primary
                      path: frontend/src/AppShell.tsx
                    - input: primary
                      path: frontend/src/PublicGalleryShell.tsx
                children:
                  - id: >-
                      browser-portal-app/browser-runtime/route-dispatch/public-gallery-shell/public-gallery-index
                    type: core/frontend.types.frontend
                    name: Public Gallery Index
                    description: Listing surface for gallery browsing.
                    provenance:
                      locations:
                        - input: primary
                          path: frontend/src/AppShell.tsx
                        - input: primary
                          path: frontend/src/PublicGalleryShell.tsx
                  - id: >-
                      browser-portal-app/browser-runtime/route-dispatch/public-gallery-shell/public-gallery-viewer
                    type: core/frontend.types.frontend
                    name: Public Gallery Viewer
                    description: Viewer outlet for an individual gallery diagram.
                    provenance:
                      locations:
                        - input: primary
                          path: frontend/src/AppShell.tsx
                        - input: primary
                          path: frontend/src/PublicGalleryShell.tsx
              - id: browser-portal-app/browser-runtime/route-dispatch/gallery-query
                type: core/code.types.module
                name: Gallery Query
                description: Gallery retrieval split into routing plus remote and local client paths.
                provenance:
                  locations:
                    - input: primary
                      path: frontend/src/gallery/gallery-query.ts
                    - input: primary
                      path: README.md
                children:
                  - id: browser-portal-app/browser-runtime/route-dispatch/gallery-query/query-router
                    type: core/code.types.module
                    name: Query Router
                    description: >-
                      Gallery query router that applies retry policy, dispatches remote retrieval,
                      and routes to local fallback.
                    provenance:
                      locations:
                        - input: primary
                          path: frontend/src/gallery/gallery-query.ts
                        - input: primary
                          path: README.md
                    children:
                      - id: >-
                          browser-portal-app/browser-runtime/route-dispatch/gallery-query/query-router/gallery-query-policy
                        type: core/code.types.module
                        name: Gallery Query Policy
                        description: Retry limits, error checks, and backoff.
                        provenance:
                          locations:
                            - input: primary
                              path: frontend/src/gallery/gallery-query.ts
                            - input: primary
                              path: README.md
                      - id: >-
                          browser-portal-app/browser-runtime/route-dispatch/gallery-query/query-router/remote-query-route
                        type: core/code.types.module
                        name: Remote Query Route
                        description: Retryable API-backed gallery retrieval.
                        provenance:
                          locations:
                            - input: primary
                              path: frontend/src/gallery/gallery-query.ts
                      - id: >-
                          browser-portal-app/browser-runtime/route-dispatch/gallery-query/query-router/local-fallback-route
                        type: core/code.types.module
                        name: Local Fallback Route
                        description: Gallery retrieval through the local corpus.
                        provenance:
                          locations:
                            - input: primary
                              path: frontend/src/gallery/gallery-query.ts
                            - input: primary
                              path: README.md
                  - id: >-
                      browser-portal-app/browser-runtime/route-dispatch/gallery-query/remote-gallery-client
                    type: core/code.types.module
                    name: Remote Gallery Client
                    description: Calls the hosted backend API.
                    provenance:
                      locations:
                        - input: primary
                          path: frontend/src/gallery/gallery-query.ts
                        - input: primary
                          path: frontend/src/api/generated/gallery/gallery.ts
                  - id: >-
                      browser-portal-app/browser-runtime/route-dispatch/gallery-query/local-fallback-client
                    type: core/code.types.module
                    name: Local Fallback Client
                    description: Calls the repository-backed local gallery.
                    provenance:
                      locations:
                        - input: primary
                          path: frontend/src/gallery/gallery-query.ts
                        - input: primary
                          path: README.md
              - id: browser-portal-app/browser-runtime/route-dispatch/local-gallery
                type: core/code.types.module
                name: Local Gallery
                description: Curated file loader.
                provenance:
                  locations:
                    - input: primary
                      path: frontend/src/gallery/local-gallery.ts
                    - input: primary
                      path: frontend/src/gallery/gallery-query.ts
          - id: browser-portal-app/browser-runtime/semantic-bootstrap
            type: core/web-app.types.group
            name: Semantic Bootstrap
            description: Semantic bootstrap split into startup coordination and bundled asset boundaries.
            props:
              framework: react
              runtime: browser
              mode: mixed
            provenance:
              locations:
                - input: primary
                  path: frontend/src/semantic/bootstrap.ts
                - input: primary
                  path: frontend/src/semantic/bundled-diagrams.ts
                - input: primary
                  path: frontend/src/semantic/trusted-bundled-assets.ts
            children:
              - id: browser-portal-app/browser-runtime/semantic-bootstrap/bootstrap
                type: core/code.types.module
                name: Bootstrap
                description: >-
                  Bootstrap runtime for loading trusted bundled semantic assets before the browser
                  shells render.
                provenance:
                  locations:
                    - input: primary
                      path: frontend/src/semantic/bootstrap.ts
                    - input: primary
                      path: frontend/src/AppShell.tsx
                children:
                  - id: >-
                      browser-portal-app/browser-runtime/semantic-bootstrap/bootstrap/bootstrap-runtime
                    type: core/code.types.module
                    name: Bootstrap Runtime
                    description: Startup loader for bundled semantic assets.
                    provenance:
                      locations:
                        - input: primary
                          path: frontend/src/semantic/bootstrap.ts
                        - input: primary
                          path: frontend/src/AppShell.tsx
              - id: browser-portal-app/browser-runtime/semantic-bootstrap/bundled-diagrams
                type: core/web-app.types.group
                name: Bundled Diagrams
                description: Bundled starter diagram exports consumed by the bootstrap path.
                props:
                  mode: mixed
                provenance:
                  locations:
                    - input: primary
                      path: frontend/src/semantic/bundled-diagrams.ts
                    - input: primary
                      path: frontend/src/semantic/bootstrap.ts
                children:
                  - id: >-
                      browser-portal-app/browser-runtime/semantic-bootstrap/bundled-diagrams/starter-diagram-bundle
                    type: core/web-app.types.group
                    name: Starter Diagram Bundle
                    description: Bundled starter diagram assets used during bootstrap.
                    props:
                      mode: typed
                      groupType: core/code.types.module
                    provenance:
                      locations:
                        - input: primary
                          path: frontend/src/semantic/bundled-diagrams.ts
                        - input: primary
                          path: frontend/src/semantic/bootstrap.ts
                    children:
                      - id: >-
                          browser-portal-app/browser-runtime/semantic-bootstrap/bundled-diagrams/starter-diagram-bundle/starter-diagram-raw
                        type: core/code.types.module
                        name: Starter Diagram Raw
                        description: Bundled raw starter diagram input.
                        provenance:
                          locations:
                            - input: primary
                              path: frontend/src/semantic/bundled-diagrams.ts
                            - input: primary
                              path: frontend/src/semantic/bootstrap.ts
                      - id: >-
                          browser-portal-app/browser-runtime/semantic-bootstrap/bundled-diagrams/starter-diagram-bundle/starter-diagram-aliases
                        type: core/code.types.module
                        name: Starter Diagram Aliases
                        description: Named aliases for the bundled starter diagram.
                        provenance:
                          locations:
                            - input: primary
                              path: frontend/src/semantic/bundled-diagrams.ts
                  - id: >-
                      browser-portal-app/browser-runtime/semantic-bootstrap/bundled-diagrams/starter-diagram-raw
                    type: core/code.types.module
                    name: Starter Diagram Raw
                    description: Primary bundled starter diagram asset.
                    provenance:
                      locations:
                        - input: primary
                          path: frontend/src/semantic/bundled-diagrams.ts
                  - id: >-
                      browser-portal-app/browser-runtime/semantic-bootstrap/bundled-diagrams/starter-diagram-aliases
                    type: core/code.types.module
                    name: Starter Diagram Aliases
                    description: Secondary export aliases for the starter diagram asset.
                    provenance:
                      locations:
                        - input: primary
                          path: frontend/src/semantic/bundled-diagrams.ts
              - id: browser-portal-app/browser-runtime/semantic-bootstrap/trusted-bundled-assets
                type: core/web-app.types.group
                name: Trusted Bundled Assets
                description: Trusted parse boundary for bundled semantic assets.
                props:
                  mode: mixed
                provenance:
                  locations:
                    - input: primary
                      path: frontend/src/semantic/trusted-bundled-assets.ts
                    - input: primary
                      path: frontend/src/semantic/bootstrap.ts
                children:
                  - id: >-
                      browser-portal-app/browser-runtime/semantic-bootstrap/trusted-bundled-assets/trusted-document-parser
                    type: core/web-app.types.application
                    name: Trusted Document Parser
                    description: Parse-only wrapper for bundled semantic documents.
                    provenance:
                      locations:
                        - input: primary
                          path: frontend/src/semantic/trusted-bundled-assets.ts
                  - id: >-
                      browser-portal-app/browser-runtime/semantic-bootstrap/trusted-bundled-assets/trusted-schema-parser
                    type: core/web-app.types.application
                    name: Trusted Schema Parser
                    description: Parse-only wrapper for bundled schema modules.
                    provenance:
                      locations:
                        - input: primary
                          path: frontend/src/semantic/trusted-bundled-assets.ts
          - id: browser-portal-app/browser-runtime/viewer-core
            type: core/code.types.module
            name: Viewer Core
            description: >-
              Shared diagram loading, view state, inspector model, focus, and canvas binding helpers
              used by the public gallery viewer.
            provenance:
              locations:
                - input: primary
                  path: frontend/src/viewer-core/buildCanvasSemanticBindings.ts
                - input: primary
                  path: frontend/src/viewer-core/buildInspectorViewModel.ts
                - input: primary
                  path: frontend/src/viewer-core/diagram-view.ts
                - input: primary
                  path: frontend/src/viewer-core/focus-view.ts
                - input: primary
                  path: frontend/src/viewer-core/loadDiagramDocFromRaw.ts
                - input: primary
                  path: frontend/src/viewer-core/useDiagramActions.ts
                - input: primary
                  path: frontend/src/viewer-core/view-models.ts
      - id: browser-portal-app/public-gallery-shell
        type: core/web-app.types.group
        name: Public Gallery Shell
        description: Public gallery split into listing and viewer surfaces.
        props:
          framework: react
          runtime: browser
          mode: mixed
        provenance:
          locations:
            - input: primary
              path: frontend/src/PublicGalleryShell.tsx
            - input: primary
              path: frontend/src/gallery/PublicGalleryIndex.tsx
            - input: primary
              path: frontend/src/gallery/PublicGalleryViewer.tsx
        children:
          - id: browser-portal-app/public-gallery-shell/public-gallery-index
            type: core/frontend.types.frontend
            name: Public Gallery Index
            description: Searchable gallery listing surface.
            props:
              framework: react
              runtime: browser
            provenance:
              locations:
                - input: primary
                  path: frontend/src/gallery/PublicGalleryIndex.tsx
                - input: primary
                  path: frontend/src/PublicGalleryShell.tsx
          - id: browser-portal-app/public-gallery-shell/public-gallery-viewer
            type: core/web-app.types.group
            name: Public Gallery Viewer
            description: >-
              Public gallery viewer split into the browser surface and the semantic rendering
              boundary.
            props:
              framework: react
              runtime: browser
              mode: mixed
            provenance:
              locations:
                - input: primary
                  path: frontend/src/gallery/PublicGalleryViewer.tsx
                - input: primary
                  path: frontend/src/PublicGalleryShell.tsx
            children:
              - id: browser-portal-app/public-gallery-shell/public-gallery-viewer/viewer-shell
                type: core/frontend.types.frontend
                name: Viewer Shell
                description: Single-diagram viewer surface.
                props:
                  framework: react
                  runtime: browser
                provenance:
                  locations:
                    - input: primary
                      path: frontend/src/gallery/PublicGalleryViewer.tsx
                    - input: primary
                      path: frontend/src/PublicGalleryShell.tsx
              - id: >-
                  browser-portal-app/public-gallery-shell/public-gallery-viewer/viewer-rendering-pipeline
                type: core/web-app.types.group
                name: Viewer Rendering Pipeline
                description: >-
                  Rendering pipeline for loading, running, and presenting a selected gallery
                  diagram.
                props:
                  mode: mixed
                provenance:
                  locations:
                    - input: primary
                      path: frontend/src/gallery/PublicGalleryViewer.tsx
                    - input: primary
                      path: frontend/src/PublicGalleryShell.tsx
                children:
                  - id: >-
                      browser-portal-app/public-gallery-shell/public-gallery-viewer/viewer-rendering-pipeline/gallery-diagram-loader
                    type: core/web-app.types.application
                    name: Gallery Diagram Loader
                    description: Fetches and normalizes the selected gallery diagram.
                    provenance:
                      locations:
                        - input: primary
                          path: frontend/src/gallery/PublicGalleryViewer.tsx
                        - input: primary
                          path: frontend/src/PublicGalleryShell.tsx
                  - id: >-
                      browser-portal-app/public-gallery-shell/public-gallery-viewer/viewer-rendering-pipeline/semantic-render-runtime
                    type: core/web-app.types.application
                    name: Semantic Render Runtime
                    description: Builds the semantic runtime, engine, and surface state.
                    provenance:
                      locations:
                        - input: primary
                          path: frontend/src/gallery/PublicGalleryViewer.tsx
                  - id: >-
                      browser-portal-app/public-gallery-shell/public-gallery-viewer/viewer-rendering-pipeline/viewer-chrome
                    type: core/web-app.types.application
                    name: Viewer Chrome
                    description: Toolbar, inspector, and search reveal chrome.
                    provenance:
                      locations:
                        - input: primary
                          path: frontend/src/gallery/PublicGalleryViewer.tsx
  - id: backend-api-contract
    type: core/web-app.types.external-api
    name: Hosted Backend API
    description: Hosted backend API boundary.
    props:
      category: external-service
      direction: outbound
      protocol: rest
      specificity: unknown
    provenance:
      locations:
        - input: primary
          path: README.md
        - input: primary
          path: openapi/tarskia-api.yaml
        - input: primary
          path: frontend/src/api/client/custom-fetch.ts
        - input: primary
          path: frontend/src/api/generated/gallery/gallery.ts
        - input: primary
          path: frontend/src/gallery/gallery-query.ts
        - input: primary
          path: frontend/src/PublicGalleryShell.tsx
  - id: gallery-source-corpus
    type: core/web-app.types.datastore
    name: Gallery Source Corpus
    description: Checked-in gallery source data split into loader logic and curated files.
    provenance:
      locations:
        - input: primary
          path: README.md
        - input: primary
          path: gallery/curated/manifest.json
        - input: primary
          path: gallery/curated/outline.yaml
        - input: primary
          path: frontend/src/gallery/local-gallery.ts
        - input: primary
          path: frontend/src/gallery/gallery-query.ts
    children:
      - id: gallery-source-corpus/gallery-local-loader
        type: core/code.types.module
        name: Gallery Local Loader
        description: >-
          Local gallery retrieval split into query orchestration, file loading, and the fallback
          corpus boundary.
        props:
          language: typescript
          runtime: browser
        provenance:
          locations:
            - input: primary
              path: frontend/src/gallery/local-gallery.ts
            - input: primary
              path: frontend/src/gallery/gallery-query.ts
            - input: primary
              path: README.md
        children:
          - id: gallery-source-corpus/gallery-local-loader/gallery-query
            type: core/code.types.module
            name: Gallery Query
            description: Gallery retrieval split into routing and local fallback client paths.
            provenance:
              locations:
                - input: primary
                  path: frontend/src/gallery/gallery-query.ts
                - input: primary
                  path: README.md
            children:
              - id: gallery-source-corpus/gallery-local-loader/gallery-query/query-router
                type: core/code.types.module
                name: Query Router
                description: >-
                  Query router that classifies retryable gallery failures, retries API fetches, and
                  routes to local fallback.
                provenance:
                  locations:
                    - input: primary
                      path: frontend/src/gallery/gallery-query.ts
                    - input: primary
                      path: README.md
                children:
                  - id: >-
                      gallery-source-corpus/gallery-local-loader/gallery-query/query-router/gallery-query-policy
                    type: core/code.types.module
                    name: Gallery Query Policy
                    description: Classifies retryable failures and backoff.
                    provenance:
                      locations:
                        - input: primary
                          path: frontend/src/gallery/gallery-query.ts
                        - input: primary
                          path: README.md
                  - id: >-
                      gallery-source-corpus/gallery-local-loader/gallery-query/query-router/gallery-api-fetcher
                    type: core/code.types.module
                    name: Gallery API Fetcher
                    description: Loads gallery data through retryable API calls.
                    provenance:
                      locations:
                        - input: primary
                          path: frontend/src/gallery/gallery-query.ts
                  - id: >-
                      gallery-source-corpus/gallery-local-loader/gallery-query/query-router/local-fallback-router
                    type: core/code.types.module
                    name: Local Fallback Router
                    description: Selects the local gallery source on fallback.
                    provenance:
                      locations:
                        - input: primary
                          path: frontend/src/gallery/gallery-query.ts
                        - input: primary
                          path: README.md
              - id: gallery-source-corpus/gallery-local-loader/gallery-query/local-gallery-client
                type: core/code.types.module
                name: Local Gallery Client
                description: Calls the local loader on fallback.
                provenance:
                  locations:
                    - input: primary
                      path: frontend/src/gallery/gallery-query.ts
          - id: gallery-source-corpus/gallery-local-loader/local-gallery
            type: core/code.types.module
            name: Local Gallery
            description: Curated file loader.
            provenance:
              locations:
                - input: primary
                  path: frontend/src/gallery/local-gallery.ts
                - input: primary
                  path: frontend/src/gallery/gallery-query.ts
          - id: gallery-source-corpus/gallery-local-loader/fallback-corpus
            type: core/web-app.types.group
            name: Fallback Corpus
            description: Local fallback corpus split into data access and query handoff.
            props:
              mode: mixed
            provenance:
              locations:
                - input: primary
                  path: README.md
                - input: primary
                  path: frontend/src/gallery/local-gallery.ts
            children:
              - id: gallery-source-corpus/gallery-local-loader/fallback-corpus/corpus-access
                type: core/code.types.module
                name: Corpus Access
                description: Repository-backed local gallery corpus access and return-to-query handoff.
                provenance:
                  locations:
                    - input: primary
                      path: README.md
                    - input: primary
                      path: frontend/src/gallery/local-gallery.ts
                children:
                  - id: >-
                      gallery-source-corpus/gallery-local-loader/fallback-corpus/corpus-access/local-corpus-reader
                    type: core/code.types.module
                    name: Local Corpus Reader
                    description: Reads the repository-backed fallback corpus.
                    provenance:
                      locations:
                        - input: primary
                          path: README.md
                        - input: primary
                          path: frontend/src/gallery/local-gallery.ts
                  - id: >-
                      gallery-source-corpus/gallery-local-loader/fallback-corpus/corpus-access/fallback-source-policy
                    type: core/code.types.module
                    name: Fallback Source Policy
                    description: Decides when the local corpus is the active source.
                    provenance:
                      locations:
                        - input: primary
                          path: frontend/src/gallery/local-gallery.ts
                  - id: >-
                      gallery-source-corpus/gallery-local-loader/fallback-corpus/corpus-access/query-handoff-bridge
                    type: core/code.types.module
                    name: Query Handoff Bridge
                    description: Returns control to the gallery query path.
                    provenance:
                      locations:
                        - input: primary
                          path: README.md
                        - input: primary
                          path: frontend/src/gallery/local-gallery.ts
              - id: gallery-source-corpus/gallery-local-loader/fallback-corpus/query-handoff
                type: core/code.types.module
                name: Query Handoff
                description: Feeds the fallback result back into gallery query logic.
                provenance:
                  locations:
                    - input: primary
                      path: README.md
                    - input: primary
                      path: frontend/src/gallery/gallery-query.ts
      - id: gallery-source-corpus/curated-diagram-files
        type: core/web-app.types.datastore
        name: Curated Diagram Files
        description: Checked-in curated gallery YAML corpus.
        provenance:
          locations:
            - input: primary
              path: gallery/curated/manifest.json
            - input: primary
              path: gallery/curated/outline.yaml
            - input: primary
              path: README.md
relations:
  - id: >-
      browser-portal-app-calls-backend-api--core--software-relations-calls--browser-portal-app--browser-runtime--route-dispatch--gallery-query--to--backend-api-contract
    from: browser-portal-app/browser-runtime/route-dispatch/gallery-query/remote-gallery-client
    to: backend-api-contract
    type: core/software.relations.calls
    description: Browser app calls the hosted backend API for gallery and schema operations.
    provenance:
      locations:
        - input: primary
          path: frontend/src/gallery/gallery-query.ts
        - input: primary
          path: frontend/src/api/client/custom-fetch.ts
        - input: primary
          path: frontend/src/api/generated/gallery/gallery.ts
        - input: primary
          path: frontend/src/PublicGalleryShell.tsx
        - input: primary
          path: openapi/tarskia-api.yaml
  - id: browser-portal-app-reads-gallery-source-corpus
    from: browser-portal-app/browser-runtime/route-dispatch/local-gallery
    to: gallery-source-corpus
    type: core/software.relations.reads
    description: Browser app reads the checked-in gallery corpus when the local fallback path is needed.
    provenance:
      locations:
        - input: primary
          path: frontend/src/gallery/local-gallery.ts
        - input: primary
          path: frontend/src/gallery/gallery-query.ts
        - input: primary
          path: frontend/src/PublicGalleryShell.tsx
        - input: primary
          path: gallery/curated/manifest.json
        - input: primary
          path: gallery/curated/outline.yaml
        - input: primary
          path: README.md
  - id: browser-portal-app--browser-runtime-calls-public-gallery-shell
