basePath: /
definitions:
  dto.GalleryDiagramDetailResponse:
    properties:
      checkpointedAt:
        type: string
      namespace:
        type: string
      raw:
        type: string
      slug:
        type: string
      title:
        type: string
      visibility:
        type: string
    type: object
  dto.GalleryDiagramSourceRepositorySummary:
    properties:
      commit:
        type: string
      committedAt:
        type: string
      ref:
        type: string
      repo:
        type: string
      url:
        type: string
    type: object
  dto.GalleryDiagramSummaryResponse:
    properties:
      namespace:
        type: string
      slug:
        type: string
      sourceRepository:
        $ref: '#/definitions/dto.GalleryDiagramSourceRepositorySummary'
      title:
        type: string
      updatedAt:
        type: string
      workerBuild:
        $ref: '#/definitions/dto.GalleryDiagramWorkerBuildSummary'
    type: object
  dto.GalleryDiagramWorkerBuildSummary:
    properties:
      approxTotalTokens:
        type: integer
      durationMs:
        type: integer
      model:
        type: string
      nodes:
        type: integer
      turns:
        type: integer
    type: object
info:
  contact: {}
  description: Public gallery API for listed diagrams and backend health.
  title: Diagram Backend API
  version: '1.0'
paths:
  /api/gallery:
    get:
      description: Returns the listed diagram gallery catalog
      operationId: listGalleryDiagrams
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.GalleryDiagramSummaryResponse'
            type: array
        '500':
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List gallery diagrams
      tags:
        - Gallery
  /api/gallery/{namespace}/{slug}:
    get:
      description: Returns a diagram gallery entry by namespace and slug
      operationId: getGalleryDiagram
      parameters:
        - description: Gallery namespace
          in: path
          name: namespace
          required: true
          type: string
        - description: Gallery slug
          in: path
          name: slug
          required: true
          type: string
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/dto.GalleryDiagramDetailResponse'
        '404':
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        '500':
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get gallery diagram
      tags:
        - Gallery
  /healthz:
    get:
      description: Returns backend and database health status
      operationId: getHealthz
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        '503':
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
        - Health
schemes:
  - http
  - https
swagger: '2.0'
